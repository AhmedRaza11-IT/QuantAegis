[tool.poetry]
name = "quantaegis"
version = "0.1.0"
description = "Production trading bot project"
authors = ["Author <author@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
MetaTrader5 = ">=5.0.45"
ccxt = ">=4.3.0"
"ccxt.pro" = {version = ">=4.3.0", source = "pypi"}
pandas = ">=2.2.0"
pandas-ta = ">=0.3.14b"
numpy = ">=1.26.0"
vectorbt = ">=0.26.0"
python-telegram-bot = {extras = ["webhooks"], version = ">=21.0"}
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
pyyaml = ">=6.0"
python-dotenv = ">=1.0.0"
structlog = ">=24.0.0"
aiohttp = ">=3.9.0"
asyncio-throttle = ">=1.0.2"
tenacity = ">=8.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.12.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
